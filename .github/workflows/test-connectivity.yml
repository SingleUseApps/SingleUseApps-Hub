name: Test VPS Connectivity (throwaway diagnostic)

# Permanently disabled (2026-08-17).
# This was a one-off Tailscale/SSH probe. It never wrote to the VPS, but it
# still used deploy secrets and tried to reach the host. All connectivity
# steps have been removed. A leftover "Run workflow" click skips the job;
# even if that guard is removed later, the remaining step is a no-op.
on:
  workflow_dispatch:

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: echo "This workflow is permanently disabled. It does not connect to the VPS."
