name: Deploy Website to VPS

# Permanently disabled (2026-08-17).
# This workflow used to rsync the repo root to /var/www/singleuseapps-portal/,
# which would overwrite the live luisdanielsilva.com personal page (not in Git)
# and --delete unmanaged paths like /vibecoding/ and /drawio2mermaid/.
# All deploy/SSH/Tailscale steps have been removed. workflow_dispatch is kept
# only so a leftover "Run workflow" click still starts this file — the job
# is skipped, and even if that guard is removed later, the remaining step
# is a no-op.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: echo "This workflow is permanently disabled. It does not deploy."
